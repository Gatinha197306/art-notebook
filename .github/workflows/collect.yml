
name: Collect exhibitions
on:
  workflow_dispatch:
  schedule:
    - cron: '25 20 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exhibitions.json
          git diff --cached --quiet || (git commit -m 'Update exhibitions' && git push)
