<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#39483e"><link rel="apple-touch-icon" href="icon.png"><title>私の美術手帖</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#302e29;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',Arial,sans-serif}header{padding:28px 20px 15px;border-bottom:1px solid #d9d0bf}h1,h2{font-family:inherit;font-weight:600}h1{margin:0;font-size:28px;letter-spacing:.12em}small{color:#716b60}main{max-width:650px;margin:auto;padding:18px 16px 110px}nav{position:fixed;bottom:0;left:0;right:0;background:#fcfaf5;display:flex;justify-content:space-around;padding:10px 2px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #d9d0bf}button,input,select,textarea,dialog{font:inherit}button{border:1px solid #b9b09e;background:#fffdf8;color:#302e29;border-radius:8px;padding:9px 12px;cursor:pointer}nav button{border:0;background:none;font-size:11px;padding:6px 3px}nav button.on{color:#8d4031;font-weight:bold}nav b{display:block;font-size:20px;margin-bottom:5px}.primary{background:#39483e;color:white;border:0}.card{background:#fffdf8;border:1px solid #ded6c8;border-radius:12px;padding:16px;margin:12px 0}.card h3{margin:6px 0;font-size:17px}.muted{color:#777064;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}label{display:block;margin:12px 0 4px;font-size:13px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfc6b5;border-radius:7px;background:#fffdf8;font-size:16px}textarea{min-height:90px}a{color:#445d50}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.month{min-height:90px;text-align:left}.month strong{display:block;font-size:20px}.active{background:#e3e8de}h2{margin:8px 0 14px}.empty{padding:32px 12px;text-align:center;color:#777064}.tag{font-size:11px;color:#8d4031}dialog{width:min(94%,500px);max-height:90vh;overflow:auto;border:1px solid #d9d0bf;border-radius:14px;background:#f5f1e8;padding:20px}dialog::backdrop{background:#0006}</style></head><body><header><small>MY ART NOTEBOOK</small><h1>私の美術手帖</h1><small>東京・神奈川から、心に残る一枚へ。</small></header><main id="main"></main><nav id="nav"></nav><dialog id="editor"></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const museums=[['東京国立博物館','東京・上野','https://www.tnm.jp/'],['国立西洋美術館','東京・上野','https://www.nmwa.go.jp/'],['東京都美術館','東京・上野','https://www.tobikan.jp/'],['国立新美術館','東京・六本木','https://www.nact.jp/'],['東京国立近代美術館','東京・竹橋','https://www.momat.go.jp/'],['太田記念美術館','東京・原宿','https://www.ukiyoe-ota-muse.jp/'],['根津美術館','東京・南青山','https://www.nezu-muse.or.jp/'],['ヨックモックミュージアム','東京・南青山','https://yokumokumuseum.com/'],['竹久夢二美術館','東京・弥生','https://www.yayoi-yumeji-museum.jp/'],['横浜美術館','神奈川・横浜','https://yokohama.art.museum/'],['神奈川県立近代美術館','神奈川・葉山／鎌倉','https://www.moma.pref.kanagawa.jp/'],['岡田美術館','神奈川・箱根','https://www.okada-museum.com/'],['ポーラ美術館','神奈川・箱根','https://www.polamuseum.or.jp/']];let data={shows:[],extra:[]};try{data=JSON.parse(localStorage.getItem('artnote-v1'))||data}catch(e){}let statusFilter="all",tab=0,year=new Date().getFullYear(),month=0,query='';const tabs=['展覧会','年間予定','お気に入り','美術館','鑑賞記録'];function save(){try{localStorage.setItem('artnote-v1',JSON.stringify(data))}catch(e){alert('端末に保存できません。バックアップを保存してください。')}}function setTab(i){tab=i;query='';render()}function link(u){return /^https?:\/\//i.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">公式情報 ↗</a>`:''}function cards(a){return a.length?a.map(s=>`<article class="card"><div class="row"><span class="tag">${s.visit?'鑑賞済み': '展覧会'}</span><button onclick="fav('${s.id}')">${s.fav?'★':'☆'}</button></div><h3>${esc(s.title)}</h3><div>${esc(s.museum)}</div><p class="muted">${esc(s.start||'未定')} 〜 ${esc(s.end||'未定')}</p>${s.visit?`<p>鑑賞日：${esc(s.visit)}　${'★'.repeat(Math.max(0,Math.min(5,Math.floor(Number(s.rating)||0))))}</p><p style="white-space:pre-wrap">${esc(s.work||'')}</p><p style="white-space:pre-wrap">${esc(s.note)}</p>`:''}<div class="row">${link(s.url)}<button onclick="edit('${s.id}')">編集・鑑賞記録</button></div></article>`).join(''):'<div class="empty">まだ登録がありません。</div>'}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="setTab(${i})"><b>${['▤','▦','♡','⌂','✎'][i]}</b>${t}</button>`).join('');let a=[...data.shows].sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));let html='';if(tab===0){html=`<div class="row"><h2>展覧会</h2><button class="primary" onclick="edit()">＋ 登録</button></div><input placeholder="展覧会・作家・美術館を検索" value="${esc(query)}" oninput="query=this.value;listShows()"><label>開催状況</label><select onchange="statusFilter=this.value;listShows()"><option value="all" ${statusFilter==='all'?'selected':''}>すべて</option><option value="now" ${statusFilter==='now'?'selected':''}>開催中</option><option value="future" ${statusFilter==='future'?'selected':''}>開催予定</option><option value="ending" ${statusFilter==='ending'?'selected':''}>終了まで14日以内</option><option value="past" ${statusFilter==='past'?'selected':''}>終了</option></select><div id="results"></div><div class="card"><small>情報収集</small><p>公開された収集データを取り込みます。取得できない場合は公式サイトで確認してください。<p id="syncstatus"></p><button onclick="syncFeed()">展覧会情報を更新</button></p><button onclick="setTab(3)">美術館の公式サイト一覧</button></div>`}if(tab===1){html=`<div class="row"><button onclick="year--;month=0;render()">‹</button><h2>${year}年</h2><button onclick="year++;month=0;render()">›</button></div><div class="months">${Array.from({length:12},(_,i)=>`<button class="month ${month===i+1?'active':''}" onclick="month=${i+1};render()"><strong>${i+1}月</strong>${inMonth(a,i+1).length}件</button>`).join('')}</div><h2>${month?month+'月の展覧会':'年間の展覧会'}</h2>${cards(month?inMonth(a,month):a.filter(s=>s.start&&s.end&&s.start<=year+'-12-31'&&s.end>=year+'-01-01'))}`}if(tab===2)html='<h2>行きたい展覧会</h2>'+cards(a.filter(s=>s.fav));if(tab===3)html=`<div class="row"><h2>美術館一覧</h2><button onclick="addMuseum()">＋ 追加</button></div>`+[...museums,...data.extra].map(m=>`<div class="card"><h3>${esc(m[0])}</h3><p class="muted">${esc(m[1])}</p>${link(m[2])}</div>`).join('');if(tab===4)html='<h2>鑑賞記録</h2>'+cards(a.filter(s=>s.visit).sort((a,b)=>b.visit.localeCompare(a.visit)));$('main').innerHTML=html+'<div class="row" style="margin-top:25px"><button onclick="backup()">バックアップ保存</button><button onclick="document.getElementById(\'restore\').click()">復元</button><input hidden type="file" id="restore" accept="application/json" onchange="restore(this)"></div>';if(tab===0)listShows()}
function inMonth(a,m){let start=`${year}-${String(m).padStart(2,'0')}-01`,end=`${year}-${String(m).padStart(2,'0')}-${new Date(year,m,0).getDate()}`;return a.filter(s=>s.start&&s.end&&s.start<=end&&s.end>=start)}function listShows(){ $('results').innerHTML=cards(data.shows.filter(s=>[s.title,s.museum,s.artist,s.genre].join(' ').toLowerCase().includes(query.toLowerCase())&&matchesStatus(s)).sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999')))}function fav(id){let s=data.shows.find(s=>s.id===id);s.fav=!s.fav;save();render()}function edit(id){let s=data.shows.find(s=>s.id===id)||{}; $('editor').innerHTML=`<form id="ef"><h2>${id?'展覧会を編集':'展覧会を登録'}</h2><label>展覧会名・作家名</label><input name="title" required value="${esc(s.title)}"><label>美術館</label><input name="museum" required list="ml" value="${esc(s.museum)}"><datalist id="ml">${[...museums,...data.extra].map(m=>`<option value="${esc(m[0])}">`).join('')}</datalist><label>作家</label><input name="artist" value="${esc(s.artist)}"><label>ジャンル</label><input name="genre" value="${esc(s.genre)}"><label>開催初日</label><input type="date" name="start" value="${esc(s.start)}"><label>開催最終日</label><input type="date" name="end" value="${esc(s.end)}"><label>公式URL</label><input type="url" name="url" value="${esc(s.url)}"><label><input style="width:auto" type="checkbox" name="fav" ${s.fav?'checked':''}> 行きたい</label><h2>鑑賞記録</h2><label>鑑賞日</label><input type="date" name="visit" value="${esc(s.visit)}"><label>評価</label><select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(s.rating||0)===n?'selected':''}>${n?'★'.repeat(n):'未評価'}</option>`).join('')}</select><label>印象に残った作品</label><input name="work" value="${esc(s.work)}"><label>感想</label><textarea name="note">${esc(s.note)}</textarea><p class="row"><button type="button" onclick="$('editor').close()">閉じる</button>${id?`<button type="button" onclick="removeShow('${id}')">削除</button>`:''}<button class="primary">保存</button></p></form>`;$('editor').showModal();$('ef').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.start&&f.end&&f.start>f.end){alert('開催日を確認してください');return}f.fav=!!f.fav;f.id=id||Date.now().toString(36)+Math.random().toString(36).slice(2,8);f.source=s.source;data.shows=data.shows.filter(s=>s.id!==f.id);data.shows.push(f);save();$('editor').close();render()}}function removeShow(id){if(confirm('この展覧会と鑑賞記録を削除しますか？')){data.shows=data.shows.filter(s=>s.id!==id);save();$('editor').close();render()}}function addMuseum(){let n=prompt('美術館名');if(!n)return;let p=prompt('所在地')||'',u=prompt('公式URL')||'';data.extra.push([n,p,u]);save();render()}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='art-notebook-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.shows)||!Array.isArray(d.extra)||!d.shows.every(s=>typeof s.id==='string'&&/^[a-z0-9]+$/.test(s.id)))throw Error();if(confirm('現在の記録をバックアップの内容に置き換えますか？')){data=d;data.shows=data.shows.map(s=>({...s,rating:Math.max(0,Math.min(5,Number(s.rating)||0))}));save();render()}}catch(e){alert('バックアップを読み込めませんでした')}}function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function matchesStatus(s){let t=localDay(),d=new Date();d.setDate(d.getDate()+14);return statusFilter==='all'||statusFilter==='now'&&s.start&&s.end&&s.start<=t&&s.end>=t||statusFilter==='future'&&s.start>t||statusFilter==='past'&&s.end&&s.end<t||statusFilter==='ending'&&s.start&&s.start<=t&&s.end>=t&&s.end<=localDay(d)}
async function syncFeed(){let el=$('syncstatus');try{let r=await fetch('exhibitions.json',{cache:'no-store'});if(!r.ok)throw Error();let feed=await r.json();let count=0;for(let x of feed.shows||[]){if(!x.title||!x.museum||!x.start||!x.end||!/^https?:\/\//.test(x.url||''))continue;let old=data.shows.find(s=>s.source===x.source||s.title===x.title&&s.museum===x.museum&&s.start===x.start);if(old)continue;data.shows.push({...x,id:Date.now().toString(36)+Math.random().toString(36).slice(2,8)});count++}save();render();el=$('syncstatus');if(el)el.textContent=`新規 ${count}件／収集日時 ${feed.updated||'未収集'}。取得元の掲載内容をご確認ください。`;}catch(e){if(el)el.textContent='収集データに接続できません。公式サイトから手動登録できます。'}}
render();if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});syncFeed()}
</script></body></html>
